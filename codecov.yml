codecov:
  require_ci_to_pass: yes

coverage:
  precision: 2
  round: down
  range: "70...100"

  status:
    project:
      default:
        target: 80%
        threshold: 5%
        base: auto

    patch:
      default:
        target: 70%
        base: auto

comment:
  layout: "reach,diff,flags,tree"
  behavior: default
  require_changes: no

flags:
  php:
    paths:
      - api/
    carryforward: true

  python:
    paths:
      - generate_pool.py
    carryforward: true

  javascript:
    paths:
      - assets/
    carryforward: true

ignore:
  - "tests/**/*"
  - "test/**/*"
  - "vendor/**/*"
  - "node_modules/**/*"
  - "**/*.test.js"
  - "**/*Test.php"
