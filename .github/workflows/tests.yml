name: Test Suite

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  php-tests:
    name: PHP Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: json, mbstring
        coverage: xdebug

    - name: Validate composer.json
      run: composer validate --strict

    - name: Cache Composer packages
      id: composer-cache
      uses: actions/cache@v3
      with:
        path: vendor
        key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
        restore-keys: |
          ${{ runner.os }}-php-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run PHPUnit tests
      run: ./vendor/bin/phpunit --coverage-text --coverage-clover=coverage.xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: php
        name: php-coverage

  python-tests:
    name: Python Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements-dev.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements-dev.txt
        pip install pandas openpyxl

    - name: Run pytest
      run: python -m pytest --cov=. --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage.xml
        flags: python
        name: python-coverage

  javascript-tests:
    name: JavaScript Tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Jest tests
      run: npm run test:coverage

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./coverage/lcov.info
        flags: javascript
        name: javascript-coverage

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [php-tests, python-tests, javascript-tests]

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'
        extensions: json, mbstring

    - name: Install Composer dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run integration tests
      run: ./vendor/bin/phpunit tests/php/Integration

  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.1'

    - name: Check file permissions
      run: |
        echo "Checking critical file permissions..."
        ls -la api/
        ls -la data/ || echo "Data directory doesn't exist (will be created)"

    - name: Verify test infrastructure
      run: |
        echo "Verifying test files exist..."
        test -f phpunit.xml && echo "✓ phpunit.xml found"
        test -f pytest.ini && echo "✓ pytest.ini found"
        test -f jest.config.js && echo "✓ jest.config.js found"
        test -f package.json && echo "✓ package.json found"
        test -f composer.json && echo "✓ composer.json found"

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [php-tests, python-tests, javascript-tests, integration-tests]
    if: always()

    steps:
    - name: Check test results
      run: |
        echo "Test Summary:"
        echo "============="
        echo "PHP Tests: ${{ needs.php-tests.result }}"
        echo "Python Tests: ${{ needs.python-tests.result }}"
        echo "JavaScript Tests: ${{ needs.javascript-tests.result }}"
        echo "Integration Tests: ${{ needs.integration-tests.result }}"

    - name: Fail if any tests failed
      if: |
        needs.php-tests.result == 'failure' ||
        needs.python-tests.result == 'failure' ||
        needs.javascript-tests.result == 'failure' ||
        needs.integration-tests.result == 'failure'
      run: exit 1
